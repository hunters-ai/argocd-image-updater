name: Build and push to Hunters ECR

on:
  push:
    branches:
      - allow-adding-new-helm-value
      - cycle-tag-list-cache

jobs:
  build_and_push:
    if: github.repository == 'hunters-ai/argocd-image-updater'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.OPS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.OPS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "171312943278"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          ECR=171312943278.dkr.ecr.us-west-2.amazonaws.com
          BRANCH_TAG=${{ github.ref_name }}
          docker build \
            -t ${ECR}/argocd-image-updater:${BRANCH_TAG} \
            --pull \
            .
          docker push ${ECR}/argocd-image-updater:${BRANCH_TAG}
